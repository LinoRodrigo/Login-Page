<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/styles/style.css">
    <title>pagina de login</title>
</head>
<body>
    <div class="container">
        <div class="content first-content">
            <div class="primeira-coluna">
                <h2 class="titulo titulo-lado-azul">Welcome Back</h2>
                <p class="descricao descricao-primeira">To keep connected with us</p>
                <p class="descricao descricao-primeira">please login with your personal info</p>
                <button id="signin" class="btn btn-lado-azul">sign in</button>
            </div>

            <div class="segunda-coluna">
                <h2 class="titulo titulo-lado-branco">create acount</h2>
                <div class="midias-sociais">
                    <ul class="lista-midias-sociais">
                        <a class="link-midias-sociais" href="#">
                            <li  class="item-midias-sociais">
                                <i class="fa-brands fa-facebook-f"></i>
                            </li>
                        </a>
                        <a class="link-midias-sociais" href="#">
                            <li class="item-midias-sociais">
                                <i class="fa-brands fa-google-plus-g"></i>
                            </li>
                        </a>
                        <a class="link-midias-sociais" href="#">
                            <li class="item-midias-sociais">
                                <i class="fa-brands fa-linkedin-in"></i>
                            </li>
                        </a> 
                    </ul>
                </div><!--midias sociais-->
                <p class="descricao descricao-segunda">or use your email for registration:</p>
                <form class="formulario">
                    <label class="label-inputs" for="">
                        <i class="fa-regular fa-user icon-modify"></i>
                        <input type="text" placeholder="Name">
                    </label>
                    <label class="label-inputs" for="">
                        <i class="fa-regular fa-envelope icon-modify"></i>
                        <input type="email" placeholder="Email">
                    </label>
                    <label class="label-inputs" for="">
                        <i class="fa-solid fa-lock icon-modify"></i>
                        <input type="password" placeholder="Password">
                    </label>
                
                    <button class="btn btn-lado-branco">sign up</button>
                </form>
            </div><!--segunda-coluna-->

        </div><!--first content-->
        <div class="content second-content">
            <div class="primeira-coluna">
                <h2 class="titulo titulo-lado-azul">Hello, Friend!</h2>
                <p class="descricao descricao-primeira">Enter your personal details</p>
                <p class="descricao descricao-primeira">and start journey with us</p>
                <button id="signup" class="btn btn-lado-azul">sign up</button>
            </div>

            <div class="segunda-coluna">
                <h2 class="titulo titulo-lado-branco">Sing In To Developer</h2>
                <div class="midias-sociais">
                     <ul class="lista-midias-sociais">
                        <a class="link-midias-sociais" href="#">
                            <li  class="item-midias-sociais">
                                <i class="fa-brands fa-facebook-f"></i>
                            </li>
                        </a>
                        <a class="link-midias-sociais" href="#">
                            <li class="item-midias-sociais">
                                <i class="fa-brands fa-google-plus-g"></i>
                            </li>
                        </a>
                        <a class="link-midias-sociais" href="#">
                            <li class="item-midias-sociais">
                                <i class="fa-brands fa-linkedin-in"></i>
                            </li>
                        </a> 
                    </ul>
                </div><!--midias sociais-->
                <p class="descricao descricao-segunda">or use your email account:</p>
                <form class="formulario">
                    <label class="label-inputs" for="">
                        <i class="fa-regular fa-envelope icon-modify"></i>
                        <input type="email" placeholder="Email">
                    </label>
                    <label class="label-inputs" for="">
                        <i class="fa-solid fa-lock icon-modify"></i>
                        <input type="password" placeholder="Password">
                    </label>
                    <a class="link-senha" href="#">forgot your password</a>
                    <button class="btn btn-lado-branco">sign in</button>
                </form>
            </div><!--segunda-coluna-->
        </div><!--second content-->
    </div>

    <script src="/src/index.js"></script>
    <script src="https://kit.fontawesome.com/c9229be9ad.js" crossorigin="anonymous"></script>
</body>
</html>
